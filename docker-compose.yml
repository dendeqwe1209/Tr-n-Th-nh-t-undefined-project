services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: book_store
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - book_store_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: book_store
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      APP_SEED_DEMO: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
volumes:
  book_store_mysql:
